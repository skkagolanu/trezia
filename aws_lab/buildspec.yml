version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 22
    commands:
      - python -m pip install 'boto3>=1.40,<2' 'cfn-lint>=1.40,<2'
  pre_build:
    commands:
      - python -m unittest discover -s aws_lab/tests -v
      - cfn-lint --regions ap-south-1 --template infra/bootstrap.json infra/runtime.json
      - python -m unittest discover -s infra -p 'test_*.py' -v
  build:
    commands:
      - python -m aws_lab.scripts.run_worker
